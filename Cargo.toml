[workspace]
resolver = "2"
members = [
    "crates/svx-model",
    "crates/svx-read",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "LGPL-3.0-or-later"
repository = "https://github.com/OpenAEC-Foundation/svx-dll"
publish = false

[workspace.dependencies]
serde_json = "1"
svx-model = { path = "crates/svx-model" }
svx-read = { path = "crates/svx-read" }
